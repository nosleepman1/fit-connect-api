services:
  postgres:
    image: postgres:17-alpine
    container_name: fitconnect-prod-database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-fitconnect}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fitconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitconnect-prod-network

  redis:
    image: redis:7-alpine
    container_name: fitconnect-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitconnect-prod-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fitconnect-prod-backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-fitconnect}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fitconnect-prod-network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  fitconnect-prod-network:
    driver: bridge
